; Supervisord config for Inkwell's production Horizon worker.
;
; THIS FILE DID NOT EXIST. What sat here instead was
; `webhook-relay-horizon.conf` — Webhook Relay's config, copied verbatim,
; still naming program `webhook-relay-horizon` and pointing at
; /var/www/webhook-relay/current. Provisioning from Inkwell's own infra
; directory would therefore have started a SECOND Webhook Relay worker and
; still left Inkwell with none.
;
; The consequence, found on 2026-08-06: Inkwell had no supervisor program at
; all, while QUEUE_CONNECTION=redis. Ingest is synchronous, so submissions
; returned 200 and looked healthy, but nothing downstream ever ran —
; 0 deliveries across every submission the service had ever received.
;
; Install on the server:
;   sudo cp infra/supervisor/inkwell-horizon.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start inkwell-horizon
;
; Horizon must also be watching the right queues — see config/horizon.php.
; Every Inkwell job goes to inkwell-fast / inkwell-slow / inkwell-scan, and
; Horizon shipped watching only `default`, so a worker alone was not enough.

[program:inkwell-horizon]
process_name=%(program_name)s
command=php /var/www/inkwell/current/artisan horizon
autostart=true
autorestart=true
user=ubuntu
redirect_stderr=true
stdout_logfile=/var/log/inkwell/horizon.log
stdout_logfile_maxbytes=10MB
; Horizon traps SIGTERM and finishes the job in flight; give it room rather
; than killing a delivery mid-flight.
stopwaitsecs=3600
