# Canonical vhost — keep in sync with /etc/apache2/sites-available/api.inkwell.philiprehberger.com.conf.
# Certbot will append the matching -le-ssl.conf companion on first --apache run.

<VirtualHost *:80>
    ServerName api.inkwell.philiprehberger.com
    DocumentRoot /var/www/inkwell/current/public

    <Directory /var/www/inkwell/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 100 KB body cap on the public submission endpoint at the Apache layer
    # — bigger payloads get 413 before they reach PHP.
    LimitRequestBody 26214400

    ErrorLog ${APACHE_LOG_DIR}/inkwell-api-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-api-access.log combined
</VirtualHost>
