# Canonical vhost for the docs / marketing site. Reverse-proxies to PM2.

<VirtualHost *:80>
    ServerName inkwell.philiprehberger.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/

    ErrorLog ${APACHE_LOG_DIR}/inkwell-web-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-web-access.log combined
</VirtualHost>
